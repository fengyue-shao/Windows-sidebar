<svg xmlns="http://www.w3.org/2000/svg" width="1510" height="1110" viewBox="0 0 1510 1110">
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111318"/><stop offset="1" stop-color="#1C2028"/></linearGradient>
    <linearGradient id="darkBg" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#171A21"/><stop offset="1" stop-color="#0F1116"/></linearGradient>
    <linearGradient id="mediaDark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#283A5A"/><stop offset="0.55" stop-color="#202630"/><stop offset="1" stop-color="#191C22"/></linearGradient>
    <linearGradient id="mediaLight" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#DCE9F7"/><stop offset="0.55" stop-color="#EEF3F9"/><stop offset="1" stop-color="#F9FAFC"/></linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5AA7FF"/><stop offset="0.5" stop-color="#8F7CFF"/><stop offset="1" stop-color="#F09A70"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".28"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10131A" flood-opacity=".12"/></filter>
    <style>
      .ui{font-family:'Segoe UI','Microsoft YaHei',sans-serif}.mono{font-family:Consolas,monospace}.label{font-size:13px;font-weight:600;letter-spacing:.08em}.title{font-size:20px;font-weight:650}.section{font-size:15px;font-weight:650}.value{font-size:19px;font-weight:700}.small{font-size:12px}.tiny{font-size:10px}.mutedD{fill:#8E97A8}.textD{fill:#F2F5FA}.mutedL{fill:#687386}.textL{fill:#1C2430}
    </style>
  </defs>
  <rect width="1510" height="1110" rx="32" fill="url(#canvas)"/>
  <text x="52" y="54" class="ui label" fill="#7D8AA0">WINDOWS SIDEBAR / UI REFRESH 0.8</text>
  <text x="52" y="88" class="ui" font-size="28" font-weight="700" fill="#F7F9FC">更清晰、更一致、更可管理的桌面信息中心</text>
  <text x="52" y="116" class="ui small" fill="#8F98A8">三套关键状态并排审核 · Segoe UI · 8px spacing · 16px radius · Light / Dark tokens</text>

